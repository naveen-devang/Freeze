[package]
name = "freeze-pc"
version = "1.0.1"
description = "Local PC companion for Freeze"
authors = ["Freeze"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "freeze_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
axum = { version = "0.8", features = ["ws"] }
enigo = "0.6"
local-ip-address = "0.6"
rand = "0.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tauri-plugin-dialog = "2.8.0"
sysinfo = "0.39.6"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Downloads Google's platform-tools (adb) when the PC has none; same rustls stack as the updater.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Storage_Streams", "Wdk_Graphics_Direct3D", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# GPU vendor libraries (NVML, AMD ADLX/ADL, Intel IGCL) are loaded at runtime; none is required.
nvml-wrapper = "0.13.0"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
