# Builds and tests the PC companion's sensor code on Windows and macOS, and checks the shared PC stats
# widgets render in every GPU scenario. The live sample runs the real sensor sources on each runner
# (no physical GPU there, so it proves they start, read and fall back without crashing).
name: PC stats

on:
  push:
    # Branches only: a release tag points at a commit these checks already ran on.
    branches: ['**']
    paths: ['pc-companion/**', 'phone-app/src/pc-stats*', 'scripts/*pc-stats*', 'scripts/build-mediaremote-adapter.sh', '.github/workflows/pc-stats.yml']
  pull_request:
    paths: ['pc-companion/**', 'phone-app/src/pc-stats*', 'scripts/*pc-stats*', 'scripts/build-mediaremote-adapter.sh', '.github/workflows/pc-stats.yml']

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pc-companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin' || '' }}
      # Tauri's build script needs the built frontend.
      - run: npm ci && npx vite build
      # Builds the macOS now playing adapter and checks it still loads and reads MediaRemote.
      - name: Build the now playing adapter
        if: matrix.os == 'macos-latest'
        run: MEDIAREMOTE_FULL_TEST=1 bash scripts/build-mediaremote-adapter.sh
        working-directory: .
      - run: cargo test --lib
        working-directory: pc-companion/src-tauri
      - run: cargo test --lib live_sample -- --ignored --nocapture
        working-directory: pc-companion/src-tauri
      - name: Type-check for Intel Macs
        if: matrix.os == 'macos-latest'
        run: cargo check --target x86_64-apple-darwin
        working-directory: pc-companion/src-tauri

  widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Ubuntu runners ship Google Chrome, which the render check drives headless.
      - run: node scripts/check-pc-stats.ts
      - run: node scripts/check-clock-faces.ts
      - run: node scripts/check-web-fonts.ts
      - run: node scripts/check-web-widgets.ts
